[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phishadv"
version = "0.1.0"
description = "Adversarial robustness of ML phishing URL detectors under realistic, problem-space attacks"
readme = "README.md"
license = "MIT"
authors = [{ name = "mikedsosa" }]
requires-python = ">=3.12"  # results were produced with 3.12; CI and Docker use 3.12

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B023", "B905"]
